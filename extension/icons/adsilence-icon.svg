<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AdSilence">
  <!--
    Das App-Symbol der Erweiterung: dasselbe Zeichen wie auf der Website, auf
    der Kachel, die ein Browser in der Leiste zeigt.

    ── Warum es aus `demo/public/adsilence-icon.svg` UEBERNOMMEN ist ─────────
    Hier stand bis zum 05.09.2026 eine eigene Fassung mit anderen Massen: Ring
    43/27,5 statt 47/30, Augen bei (53|52) und (75|52) statt (38|39) und
    (62|39). Sie stammte aus einem frueheren Anlauf und ist mit dem Zeichen der
    Website nie mitgewandert — nebeneinander gestellt waren es zwei Gesichter.
    Wer das Zeichen aendert, aendert es dort und kopiert den Block hierher; die
    Begruendung zu jedem Mass steht in jener Datei und wird hier nicht
    wiederholt.

    ── Die Kachel ───────────────────────────────────────────────────────────
    Verlauf von hell nach dunkel, dieselben zwei Werte wie `BRAND_GRADIENT_*`
    (#f6821f und #e65909). Sie stehen hier als Zahl und nicht als Variable: Ein
    SVG in einem Erweiterungspaket sieht keine `.env` und keine CSS-Variable
    der Seite — es wird vom Browser gerendert, lange bevor irgendetwas von uns
    laeuft. Wer die Marke umstellt, stellt diese beiden Werte mit um.

    Das Zeichen liegt in seinem eigenen Koordinatenfeld (-6 bis 106) und wird
    mit `scale(0.957)` so eingesetzt, dass der Ring einen Durchmesser von 90
    von 128 Punkten bekommt — knapp 70 %, die uebliche Kachelaufteilung. Der
    Versatz 16,13 setzt den Ringmittelpunkt (50|50) auf (64|64), also genau in
    die Mitte.
  -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#e65909"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#grund)"/>
  <g transform="translate(16.13 16.13) scale(0.957)">
    <!-- Dasselbe Dunkel wie auf der Website, nicht Weiss: Auf der orangen
         Kachel steht es bei 5,4:1 gegen #e65909 und 7,5:1 gegen #f6821f,
         und es ist Zeichen fuer Zeichen dieselbe Marke wie im Seitenkopf.
         Das Klebeband bleibt grau — es ist Material, keine Marke. -->
    <g fill="#10131b">
    <path d="M 88.03 77.62 A 47 47 0 1 1 95.55 61.60 L 79.07 57.40 A 30 30 0 1 0 74.27 67.63 Z"/>
    <circle cx="38" cy="39" r="7"/>
    <circle cx="62" cy="39" r="7"/>
    </g>
    <pattern id="gewebe" width="4.2" height="1" patternUnits="userSpaceOnUse">
    <rect width="0.5" height="1" fill="#b9bdc5" opacity=".28"/>
    </pattern>
    <g transform="rotate(-8 50 58.5) translate(51.38 0) scale(1.08 1) translate(-51.38 0)">
